	<script>
		// =========== 增强防截图系统 ===========
		let screenshotProtectionActive = false;
		let userInfo = {
			username: '访客-' + Math.floor(Math.random() * 10000),
			publicIP: '获取中...',
			localIP: '192.168.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255),
			device: navigator.platform,
			browser: navigator.userAgent.split(' ')[0],
			accessTime: '',
			userAgent: navigator.userAgent,
			screenResolution: window.screen.width + '×' + window.screen.height
		};
		
		// 获取精确到秒的当前时间
		function getFormattedTime() {
			const now = new Date();
			const year = now.getFullYear();
			const month = String(now.getMonth() + 1).padStart(2, '0');
			const day = String(now.getDate()).padStart(2, '0');
			const hours = String(now.getHours()).padStart(2, '0');
			const minutes = String(now.getMinutes()).padStart(2, '0');
			const seconds = String(now.getSeconds()).padStart(2, '0');
			return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
		}
		
		// 获取设备信息
		function getDeviceInfo() {
			const ua = navigator.userAgent;
			let device = '未知设备';
			
			if (ua.match(/Android/i)) device = 'Android设备';
			else if (ua.match(/webOS/i)) device = 'webOS设备';
			else if (ua.match(/iPhone/i)) device = 'iPhone设备';
			else if (ua.match(/iPad/i)) device = 'iPad设备';
			else if (ua.match(/iPod/i)) device = 'iPod设备';
			else if (ua.match(/BlackBerry/i)) device = '黑莓设备';
			else if (ua.match(/Windows Phone/i)) device = 'Windows Phone设备';
			else if (ua.match(/Windows NT/i)) device = 'Windows设备';
			else if (ua.match(/Macintosh/i)) device = 'Mac设备';
			else if (ua.match(/Linux/i)) device = 'Linux设备';
			
			return device;
		}
		
		// 获取公网IP - 使用多个备用API并优化手机端兼容性
		async function getPublicIP() {
			// 备用API列表 - 优先选择HTTPS和跨域友好的
			const apis = [
				{ url: 'https://api.ipify.org?format=json', type: 'json', field: 'ip' },
				{ url: 'https://api.ip.sb/jsonip', type: 'json', field: 'ip' },
				{ url: 'https://api.my-ip.io/ip.json', type: 'json', field: 'ip' },
				{ url: 'https://ipinfo.io/json', type: 'json', field: 'ip' },
				{ url: 'https://ipapi.co/json/', type: 'json', field: 'ip' },
				{ url: 'https://icanhazip.com/', type: 'text' }
			];

			// 为手机端添加User-Agent以绕过某些限制
			const mobileUserAgent = window.navigator.userAgent;
			const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(mobileUserAgent);
			
			// 创建AbortController用于超时控制
			const controller = new AbortController();
			const timeoutId = setTimeout(() => controller.abort(), 8000);

			// 尝试每个API直到成功
			for (let i = 0; i < apis.length; i++) {
				try {
					const api = apis[i];
					console.log(`正在从 ${api.url} 获取公网IP...`);
					
					const headers = {
						'Accept': api.type === 'json' ? 'application/json' : 'text/plain'
					};
					
					// 如果是移动设备，添加一些浏览器标识
					if (isMobile) {
						headers['User-Agent'] = mobileUserAgent;
					}
					
					const response = await fetch(api.url, {
						method: 'GET',
						headers: headers,
						signal: controller.signal,
						mode: 'cors',
						credentials: 'omit' // 手机端避免发送cookies
					});
					
					if (response.ok) {
						let ip;
						
						if (api.type === 'text') {
							// 处理纯文本响应
							const ipText = await response.text();
							ip = ipText.trim();
						} else {
							// 处理JSON响应
							const data = await response.json();
							ip = data[api.field] || data.ip || data.query || data.ip_address;
						}
						
						// 验证IP地址格式（支持IPv4和IPv6）
						const ipv4Regex = /^(\d{1,3}\.){3}\d{1,3}$/;
						const ipv6Regex = /^([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$/;
						
						if (ip && (ipv4Regex.test(ip) || ipv6Regex.test(ip))) {
							console.log(`成功从 ${api.url} 获取公网IP:`, ip);
							clearTimeout(timeoutId);
							return ip;
						} else if (ip) {
							console.warn(`从 ${api.url} 获取的IP格式可能不正确:`, ip);
							// 但仍然返回获取到的值
							clearTimeout(timeoutId);
							return ip;
						} else {
							console.warn(`从 ${api.url} 未获取到IP字段`);
							continue;
						}
					} else {
						console.warn(`${api.url} 响应状态码:`, response.status);
						continue;
					}
				} catch (error) {
					console.error(`从 ${apis[i].url} 获取公网IP失败:`, error.name, error.message);
					
					// 如果是超时或网络错误，继续尝试下一个
					if (error.name === 'AbortError' || error.name === 'TypeError') {
						continue;
					}
					
					// 其他错误也继续尝试
					continue;
				}
			}
			
			clearTimeout(timeoutId);
			
			// 所有API都失败时，尝试使用iframe方法作为备选方案
			try {
				console.log('尝试使用iframe方法获取IP...');
				return await getIPViaIframe();
			} catch (iframeError) {
				console.error('iframe方法也失败:', iframeError);
			}
			
			// 最终备选方案：生成伪IP
			if (isMobile) {
				console.log('所有方法都失败，使用移动设备伪IP');
				return `M-${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
			}
			
			return '未知IP';
		}

		// 备选方案：通过iframe获取IP
		function getIPViaIframe() {
			return new Promise((resolve, reject) => {
				const iframe = document.createElement('iframe');
				iframe.style.display = 'none';
				iframe.src = 'https://api.ipify.org?format=jsonp';
				
				let timeoutId = setTimeout(() => {
					document.body.removeChild(iframe);
					reject(new Error('iframe超时'));
				}, 5000);
				
				iframe.onload = function() {
					try {
						// 尝试从iframe的内容中获取IP
						const content = iframe.contentWindow?.document?.body?.innerText;
						if (content && content.includes('ip')) {
							const match = content.match(/"ip"\s*:\s*"([^"]+)"/);
							if (match && match[1]) {
								clearTimeout(timeoutId);
								document.body.removeChild(iframe);
								resolve(match[1]);
								return;
							}
						}
					} catch (e) {
						// 跨域安全限制
					}
					
					clearTimeout(timeoutId);
					document.body.removeChild(iframe);
					reject(new Error('无法从iframe获取IP'));
				};
				
				iframe.onerror = function() {
					clearTimeout(timeoutId);
					document.body.removeChild(iframe);
					reject(new Error('iframe加载错误'));
				};
				
				document.body.appendChild(iframe);
			});
		}

		
		// 初始化防截图系统
		async function initializeScreenshotProtection() {
			console.log('防截图系统启动中...');
			
			// 检查是否在密码验证有效期内
			const expiry = localStorage.getItem('protection_expiry');
			if (expiry && Date.now() < parseInt(expiry)) {
				console.log('在密码验证有效期内，跳过防截图系统');
				return;
			}
			
			// 更新用户信息
			userInfo.accessTime = getFormattedTime();
			userInfo.device = getDeviceInfo();
			
			// 获取公网IP - 增加重试机制
			console.log('正在获取公网IP...');
			let retryCount = 0;
			const maxRetries = 2;
			
			while (retryCount <= maxRetries) {
				try {
					userInfo.publicIP = await getPublicIP();
					console.log(`第${retryCount + 1}次尝试获取公网IP结果:`, userInfo.publicIP);
					
					// 如果不是"未知IP"，则跳出循环
					if (userInfo.publicIP !== '未知IP' && !userInfo.publicIP.includes('获取中')) {
						break;
					}
					
					retryCount++;
					if (retryCount <= maxRetries) {
						console.log(`IP获取失败，第${retryCount}次重试...`);
						await new Promise(resolve => setTimeout(resolve, 1000)); // 等待1秒后重试
					}
				} catch (error) {
					console.error(`第${retryCount + 1}次获取公网IP失败:`, error);
					retryCount++;
					if (retryCount <= maxRetries) {
						await new Promise(resolve => setTimeout(resolve, 1000));
					}
				}
			}
			
			// 如果最终还是失败，使用设备信息作为标识
			if (userInfo.publicIP === '未知IP' || userInfo.publicIP.includes('获取中')) {
				const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
				userInfo.publicIP = isMobile 
					? `移动设备-${Math.random().toString(36).substr(2, 6).toUpperCase()}`
					: `设备-${Math.random().toString(36).substr(2, 8).toUpperCase()}`;
				console.log('使用设备标识替代IP:', userInfo.publicIP);
			}
			
			// 启动防截图系统
			startScreenshotProtection();
			screenshotProtectionActive = true;
			
			// 监听存储变化，当防护过期时重新启动
			window.addEventListener('storage', function(e) {
				if (e.key === 'protection_expiry') {
					setTimeout(() => {
						const expiry = localStorage.getItem('protection_expiry');
						if (!expiry || Date.now() >= parseInt(expiry)) {
							if (!screenshotProtectionActive) {
								startScreenshotProtection();
								screenshotProtectionActive = true;
							}
						} else {
							stopScreenshotProtection();
							screenshotProtectionActive = false;
						}
					}, 100);
				}
			});
			
			console.log('增强防截图系统已启动');
			console.log('用户信息:', userInfo);
		}
		
		// 启动防截图防护
		function startScreenshotProtection() {
			userInfo.accessTime = getFormattedTime();
			createCoreWatermarks();
			enableCopyProtection();
		}
		
		// 停止防截图防护
		function stopScreenshotProtection() {
			// 移除所有防护层
			removeProtectionLayers();
			
			// 禁用复制保护
			disableCopyProtection();
			
			console.log('防截图系统已停止');
		}
		
		// =========== 修复：将preventDefault函数提取到外部作用域 ===========
		function preventDefaultHandler(e) {
			e.preventDefault();
			return false;
		}
		
		// 启用复制保护
		function enableCopyProtection() {
			// 禁用右键菜单
			document.addEventListener('contextmenu', preventDefaultHandler);
			
			// 禁用选择
			document.addEventListener('selectstart', preventDefaultHandler);
			
			// 禁用拖拽

		// =========== 原有防护代码（修复版） ===========
        (function() {

            const ADMIN_PASSWORD = "homo114514";

			// 检查是否在有效期内
            function isWithinProtectionWindow() {
                const expiry = localStorage.getItem(PROTECTION_EXPIRY_KEY);
                
                if (expiry) {
                    const expiryTime = parseInt(expiry);
                    const currentTime = Date.now();
                    
                    if (currentTime < expiryTime) {
                        // 在有效期内，停止防截图系统
                        if (screenshotProtectionActive) {
                            stopScreenshotProtection();
                            screenshotProtectionActive = false;
                        }
                        
                        const remainingSeconds = Math.round((expiryTime - currentTime) / 1000);
                        console.log(`防护已关闭`);
                        
                        // 移除文字选择限制
                        removeTextSelectionProtection();
                        return true;
                    } else {
						// 已过期，清理storage
                        localStorage.removeItem(PROTECTION_EXPIRY_KEY);
						// 确保文字选择限制生效
                        addTextSelectionProtection();
                    }
                } else {
					// 没有存储，确保文字选择限制生效
                    addTextSelectionProtection();
                }
                return false;
            }
            
			// 移除文字选择限制
            function removeTextSelectionProtection() {
				// 方法1：添加一个标记类来覆盖样式
                document.documentElement.classList.add('protection-disabled');
                
				// 方法2：直接修改所有protected-content元素的样式
                setTimeout(() => {
                    const elements = document.querySelectorAll('.protected-content');
                    elements.forEach(el => {
                        el.style.userSelect = 'auto';
                        el.style.webkitUserSelect = 'auto';
                        el.style.mozUserSelect = 'auto';
                        el.style.msUserSelect = 'auto';
                    });
                }, 100);
            }
            
			// 添加文字选择限制
            function addTextSelectionProtection() {
				// 移除标记类
                document.documentElement.classList.remove('protection-disabled');
                
				// 确保CSS类生效
                setTimeout(() => {
                    const elements = document.querySelectorAll('.protected-content');
                    elements.forEach(el => {
                        el.style.userSelect = '';
                        el.style.webkitUserSelect = '';
                        el.style.mozUserSelect = '';
                        el.style.msUserSelect = '';
                    });
                }, 100);
            }
            
            // 检查是否在有效期内
            if (isWithinProtectionWindow()) {
                return;
            }
            
			// =========== 以下是防护代码（只在未验证或已过期时执行） ===========
            
            // 确保文字选择限制生效
            addTextSelectionProtection();

				// 清屏并显示密码输入界面
                document.body.innerHTML = `

                    position: fixed;

                        </p>
                        
                        <div style="margin: 25px 0;">

                                刷新页面
                            </button>
                            
                            <button id="submitBtn" style="
                                flex: 1;

                </div>
                `;
                
				// 添加CSS动画
				const style = document.createElement('style');
				style.textContent = `
					@keyframes slideIn {
						from { opacity: 0; transform: translateY(30px); }
						to { opacity: 1; transform: translateY(0); }

				`;
				document.head.appendChild(style);
				
				// 绑定按钮事件
				document.getElementById('refreshBtn').onclick = () => location.reload();

					if (e.key === 'Enter') checkPassword();

				document.getElementById('adminPasswordInput').focus();
            }
            
			// 检查密码 - 修复版：确保停止所有防护
            function checkPassword() {
                const input = document.getElementById('adminPasswordInput');
                const errorDiv = document.getElementById('passwordError');
                const password = input.value.trim();
                
                if (!password) {
                    errorDiv.textContent = '请输入密码';
                    return;
                }
                
                if (password === ADMIN_PASSWORD) {
					// 密码正确 - 设置30秒有效期
                    const expiryTime = Date.now() + (30 * 1000);
                    localStorage.setItem(PROTECTION_EXPIRY_KEY, expiryTime.toString());
                    
					// 立即移除文字选择限制
                    removeTextSelectionProtection();
                    
                    // 停止防截图系统
                    if (screenshotProtectionActive) {
                        stopScreenshotProtection();
                        screenshotProtectionActive = false;
                    }
                    
                    // 禁用输入框和按钮，防止重复点击
                    input.disabled = true;
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('refreshBtn').disabled = true;
                    
                    // 显示成功消息
                    errorDiv.textContent = '✓ 密码正确，正在重新加载...';
                    errorDiv.style.color = '#28a745';
                    
					// 1秒后刷新页面 - 修复：确保刷新执行
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    errorDiv.textContent = '✗ 密码错误';
                    input.value = '';
                    input.focus();
                    
                    // 添加错误动画
                    input.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        input.style.animation = '';
                    }, 500);
                }
            }
            
			// =========== 防护事件监听器 ===========
        
        	// 快捷键防护
            document.addEventListener('keydown', function(e) {
                const blockedKeys = ['F12', 'F8'];
                const blockedCombinations = [
                    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)),
                    (e.metaKey && e.altKey && e.key === 'I'),
                    (e.ctrlKey && e.key === 'u'),
                    (e.ctrlKey && e.key === 's'),
                    (e.ctrlKey && e.key === 'p')
                ];
                
                if (blockedKeys.includes(e.key) || blockedCombinations.some(combo => combo)) {
                    e.preventDefault();
                    e.stopPropagation();
                    showPasswordInput();
                    return false;
                }
            });
            
			// 右键防护
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                showPasswordInput();
                return false;
            });
            
			// 选择防护
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;

            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            // 开发者工具检测
            (function() {

                });
                console.log('%c ', element);
            })();
            
            // 防调试（移动端跳过宽高检测，避免误触发）
            function detectDevTools() {
				if (isMobile) return;
                const threshold = 160;
                const widthThreshold = window.outerWidth - window.innerWidth > threshold;
                const heightThreshold = window.outerHeight - window.innerHeight > threshold;
                
                if (widthThreshold || heightThreshold) {
                    showPasswordInput();
                }
            }
            
            // 定期检测
            setInterval(detectDevTools, 1000);
            window.addEventListener('resize', detectDevTools);
        })();

        // 兼容性处理
		window.initializePageProtection = window.initializePageProtection || function() {
			console.log('基础防护系统已启动');
		};

		// DOM加载后的附加防护
        document.addEventListener('DOMContentLoaded', function() {
            // 如果已经在有效期内，跳过这些防护
            const expiry = localStorage.getItem("protection_expiry");
            if (expiry && Date.now() < parseInt(expiry)) {
                // 移除文字选择限制
                setTimeout(() => {
                    const elements = document.querySelectorAll('.protected-content');
                    elements.forEach(el => {
                        el.style.userSelect = 'auto';
                        el.style.webkitUserSelect = 'auto';
                        el.style.mozUserSelect = 'auto';
                        el.style.msUserSelect = 'auto';
                    });
                }, 100);
                return;
            }
            
            // 防打印（移动端跳过）
            window.onbeforeprint = function() {
                if (isMobile) return;
                document.dispatchEvent(new KeyboardEvent('keydown', {
                    key: 'p',
                    ctrlKey: true
                }));
                return false;
            };
            
            // 防PrintScreen
            document.addEventListener('keydown', function(e) {
                if (e.key === 'PrintScreen') {
                    e.preventDefault();
                    const event = new Event('contextmenu');
                    document.dispatchEvent(event);
                    return false;
                }
            });
            
            // 防窗口最小化检测（移动端跳过，避免切换App误触发）
            document.addEventListener('visibilitychange', function() {
                if (isMobile) return;
                if (document.hidden) {
                    setTimeout(() => {
                        if (document.hidden) {
                            const event = new KeyboardEvent('keydown', {
                                key: 'F12',
                                bubbles: true
                            });
                            document.dispatchEvent(event);
                        }
                    }, 1000);
                }
            });
        });
